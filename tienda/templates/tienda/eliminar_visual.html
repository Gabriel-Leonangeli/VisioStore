{% extends 'tienda/base.html' %}
{% block content %}
<div class="container mt-5 text-center">
    <h3>¿Seguro que querés eliminar <strong>{{ visual.titulo }}</strong>?</h3>
    {% if visual.imagen %}
        <img src="{{ visual.imagen.url }}" alt="{{ visual.titulo }}" class="img-thumbnail mt-3 mb-3" style="max-height:200px;">
    {% endif %}
    <p class="text-muted">Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-hover">Sí, eliminar</button>
        <a href="{% url 'mis_visuales' %}" class="btn btn-secondary ms-2">Cancelar</a>
    </form>
</div>
{% endblock %}
